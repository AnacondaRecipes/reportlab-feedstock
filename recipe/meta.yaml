{% set name = "reportlab" %}
{% set version = "5.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6878200464527e87672d19e9f7cfc6bb890e3a6931e74ac6a1a8d1754aa55671

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # reportlab/__init__.py enforces __min_python_version__ = (3, 10) (3.9 is EOL upstream)
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
  run:
    - python
    - pillow >=9.0.0
    - charset-normalizer
  run_constrained:
    # accel
    - rl-accel >=0.9.0,<1.1
    # pycairo
    - rlpycairo >=0.2.0,<1
    - freetype-py >=2.3.0,<2.4
    # upstream `bidi` (rlbidi) and `shaping` (uharfbuzz) extras are unversioned,
    # so a run_constrained entry would be a no-op and is intentionally omitted

test:
  source_files:
    - tests
    - docs
    - tools
    - setup.py
  imports:
    - reportlab
    - reportlab.graphics.charts
    - reportlab.graphics.samples
    - reportlab.graphics.widgets
    - reportlab.graphics.barcode
    - reportlab.graphics
    - reportlab.lib
    - reportlab.pdfbase
    - reportlab.pdfgen
    - reportlab.platypus
  requires:
    - pip
  commands:
    - pip check
    # upstream's suite is driven by tests/runAll.py through `setup.py tests`
    # (it needs the reportlab.lib.testutils setOutDir/testsFolder wiring);
    # pytest mis-collects module-level test() helpers and the optional rl_accel tests
    - python setup.py tests --verbose-tests  # [unix]
    - python setup.py tests --verbose-tests --no-download-t1-files --exclude=test_pdfgen_general --exclude=test_pdfgen_callback  # [win]

about:
  home: https://www.reportlab.com/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The Reportlab Toolkit
  description: |
    The ReportLab Toolkit. An Open Source Python library for generating PDFs and graphics.
  doc_url: https://docs.reportlab.com
  dev_url: https://hg.reportlab.com/hg-public/reportlab

extra:
  recipe-maintainers:
    - mcs07
